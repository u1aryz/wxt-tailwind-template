name: Sync daisyui

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-daisyui
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: daisyui
          fetch-depth: 0
          persist-credentials: false
      - name: Merge main into daisyui
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge origin/main --no-edit; then
            echo "regenerate_lockfile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -z "$conflicts" ]; then
            echo "::error::Merge failed without file conflicts."
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              package.json|pnpm-lock.yaml) ;;
              *)
                echo "::error::Merge conflict in: $file. Resolve manually on the daisyui branch."
                exit 1
                ;;
            esac
          done <<< "$conflicts"

          if grep -qx 'package.json' <<< "$conflicts"; then
            # Use the script from main, even if daisyui has not received it yet.
            git show origin/main:.github/scripts/merge-package-json.mjs > "$RUNNER_TEMP/merge-package-json.mjs"
            node "$RUNNER_TEMP/merge-package-json.mjs"
            git add package.json
          fi
          if grep -qx 'pnpm-lock.yaml' <<< "$conflicts"; then
            git checkout --ours pnpm-lock.yaml
          fi
          echo "regenerate_lockfile=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Regenerate pnpm lockfile
        if: steps.merge.outputs.regenerate_lockfile == 'true'
        run: |
          echo "Regenerating pnpm-lock.yaml from the merged package.json"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git add pnpm-lock.yaml
          git commit --no-edit

      # Pushes made with GITHUB_TOKEN do not trigger CI, so verify the merged
      # branch here before pushing it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm biome ci --error-on-warnings
      - if: hashFiles('.github/scripts/*.test.mjs') != ''
        run: node --test .github/scripts/*.test.mjs
      - run: pnpm typecheck
      - run: pnpm build

      - name: Push daisyui
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin daisyui
