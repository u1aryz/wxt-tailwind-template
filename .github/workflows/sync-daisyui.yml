name: Sync daisyui

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-daisyui
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: daisyui
          fetch-depth: 0
      - name: Merge main into daisyui
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge origin/main --no-edit; then
            echo "regenerate_lockfile=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -z "$conflicts" ]; then
            echo "::error::Merge failed without file conflicts."
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              package.json|pnpm-lock.yaml) ;;
              *)
                echo "::error::Merge conflict in: $file. Resolve manually on the daisyui branch."
                exit 1
                ;;
            esac
          done <<< "$conflicts"

          if grep -qx 'package.json' <<< "$conflicts"; then
            # Use the script from main, even if daisyui has not received it yet.
            git show origin/main:.github/scripts/merge-package-json.mjs > "$RUNNER_TEMP/merge-package-json.mjs"
            node "$RUNNER_TEMP/merge-package-json.mjs"
            git add package.json
          fi
          if grep -qx 'pnpm-lock.yaml' <<< "$conflicts"; then
            git checkout --ours pnpm-lock.yaml
          fi
          echo "regenerate_lockfile=true" >> "$GITHUB_OUTPUT"
      - if: steps.merge.outputs.regenerate_lockfile == 'true'
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6
      - if: steps.merge.outputs.regenerate_lockfile == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Regenerate pnpm lockfile
        if: steps.merge.outputs.regenerate_lockfile == 'true'
        run: |
          echo "Regenerating pnpm-lock.yaml from the merged package.json"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git add pnpm-lock.yaml
          git commit --no-edit

      - name: Push daisyui
        run: |
          git push origin daisyui
