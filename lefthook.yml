pre-commit:
  commands:
    check:
      # Format, lint, and type-check staged files, then type-check the whole project.
      run: pnpm vp check --fix --deny-warnings {staged_files} && pnpm vp check --no-fmt --no-lint
      stage_fixed: true

commit-msg:
  commands:
    "lint commit message":
      run: pnpm commitlint --edit "$1"
